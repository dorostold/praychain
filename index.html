<!DOCTYPE html>
<html lang="cs">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>DOROST – Modlitební řetězec</title>
<style>
:root{
  --navy:#2A4A5E;--teal:#86A5AB;--sand:#D3CFBF;
  --bg:#F6F5F0;--ink:#1d2f3a;--muted:#4d616c;--card:#ffffff;--line:#e2dfd3;
  --field:#6d8590;--focus:#2A4A5E;--ok:#2e6b4e;--err:#9b2c2c;--warn:#7a5c12;
  --hero:linear-gradient(135deg,#2A4A5E 0%,#1d3a4b 100%);
  --fill:#86A5AB;--fill-ink:#10222b;
  --shadow:0 1px 2px rgba(29,47,58,.05),0 12px 32px -12px rgba(29,47,58,.18);
  --radius:20px;
}
@media (prefers-color-scheme:dark){
  :root{
    --bg:#0f1c24;--ink:#eceae0;--muted:#b8c4c9;--card:#172a35;--line:#2a4150;
    --field:#86A5AB;--focus:#86A5AB;--ok:#8fd3ad;--err:#f2a7a7;--warn:#e7c77a;
    --hero:linear-gradient(135deg,#27495b 0%,#16303d 100%);--shadow:0 12px 32px -12px rgba(0,0,0,.5);
  }
  .board .card.on{box-shadow:inset 0 0 0 2px var(--focus),var(--shadow)}
}
*{box-sizing:border-box}
body{
  margin:0;min-height:100vh;color:var(--ink);background:var(--bg);
  background-image:radial-gradient(900px 500px at 90% -10%,color-mix(in srgb,var(--teal) 22%,transparent),transparent 60%);
  background-attachment:fixed;
  font:400 16px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
  -webkit-text-size-adjust:100%;
}
h1,h2,h3,p{margin:0}
:focus-visible{outline:3px solid var(--focus);outline-offset:2px;border-radius:8px}
.skip{position:absolute;left:8px;top:-60px;background:var(--navy);color:#fff;padding:8px 16px;border-radius:8px;z-index:10}
.skip:focus{top:8px}
.app{max-width:1040px;margin:0 auto;padding:16px 16px 72px}

/* top bar */
.topbar{display:flex;align-items:center;justify-content:space-between;gap:16px;padding:8px 0 24px;flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:14px}
.logo{display:flex;align-items:center;font:700 26px/1 Georgia,serif;letter-spacing:-1px;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:10px 12px;box-shadow:var(--shadow)}
.logo b{color:var(--teal)}
.logo i{color:var(--sand);font-style:normal;-webkit-text-stroke:1px #b9b49f}
.logo svg{margin:0 2px}
.brand h1{font-size:20px;font-weight:700;letter-spacing:-.01em}
.brand .sub{font-size:13px;letter-spacing:.14em;color:var(--muted);font-weight:600}
.sync{display:inline-flex;align-items:center;gap:8px;font-size:14px;font-weight:600;color:var(--muted);background:var(--card);border:1px solid var(--line);border-radius:99px;padding:8px 14px}
.sync i{width:8px;height:8px;border-radius:50%;background:var(--sand)}
.sync.live i{background:var(--ok);box-shadow:0 0 0 4px color-mix(in srgb,var(--ok) 20%,transparent)}
.sync.connecting i{background:var(--teal);animation:pulse 1.2s ease-in-out infinite}
.sync.error i{background:var(--err)}
.sync.error{color:var(--err)}
.alert{font-weight:600;color:var(--err);margin:0 0 16px}
.alert:empty{display:none}

/* hero */
.hero{background:var(--hero);color:#fff;border-radius:28px;padding:28px;box-shadow:var(--shadow);position:relative;overflow:hidden;animation:rise .5s ease both}
.hero::after{content:"";position:absolute;right:-60px;top:-60px;width:220px;height:220px;border-radius:50%;background:rgba(134,165,171,.18);pointer-events:none}
.hero p{position:relative}
.hero .eyebrow{font-size:14px;color:rgba(255,255,255,.85);font-weight:600;letter-spacing:.02em}
.hero .who{font-size:clamp(34px,8vw,52px);font-weight:700;line-height:1.1;letter-spacing:-.02em;margin:8px 0 20px}
.hero .lead{color:rgba(255,255,255,.88);font-size:15px}
.hero :focus-visible{outline-color:#fff}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin:12px 0 0;padding:0;list-style:none;position:relative}
.chip{background:rgba(255,255,255,.12);border:1px solid rgba(255,255,255,.26);border-radius:99px;padding:6px 14px;font-size:15px;backdrop-filter:blur(4px)}
.hero .btn{margin-top:24px;position:relative;color:#fff;border-color:rgba(255,255,255,.55);background:rgba(255,255,255,.08)}
.hero .btn:hover{background:rgba(255,255,255,.18)}

/* buttons */
.btn{font:inherit;font-weight:600;min-height:44px;padding:10px 18px;border-radius:99px;border:1px solid var(--field);background:var(--card);color:var(--ink);cursor:pointer;transition:background .2s,transform .12s,border-color .2s;display:inline-flex;align-items:center;justify-content:center;gap:8px}
.btn:hover{border-color:var(--navy);background:color-mix(in srgb,var(--teal) 16%,var(--card))}
.btn:active{transform:scale(.98)}
.btn:disabled{opacity:.4;cursor:default;transform:none}
.btn.primary{background:var(--fill);color:var(--fill-ink);border-color:var(--fill)}
.btn.primary:hover{background:color-mix(in srgb,var(--fill) 82%,#000);border-color:var(--fill)}
.round{width:44px;height:44px;padding:0;border-radius:50%;font-size:22px;line-height:1}

/* month bar */
.monthbar{display:flex;align-items:center;justify-content:space-between;gap:16px;margin:32px 0 0;background:var(--card);border:1px solid var(--line);border-radius:99px;padding:8px;box-shadow:var(--shadow)}
.mtitle{text-align:center;flex:1;min-width:0}
.mtitle h2{font-size:20px;font-weight:700;letter-spacing:-.01em}
.note{font-size:13px;color:var(--muted);margin-top:2px}
.note:empty{display:none}

/* sections */
.section{margin-top:40px}
.sec-title{font-size:18px;font-weight:700;margin-bottom:16px;letter-spacing:-.01em}

/* board */
.board{list-style:none;margin:0;padding:0;display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:16px}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:18px;box-shadow:var(--shadow);transition:transform .2s,box-shadow .2s;animation:rise .4s ease both}
@media (hover:hover){.card:hover{transform:translateY(-3px)}}
.card.on{box-shadow:inset 0 0 0 2px var(--focus),var(--shadow)}
.card-head{display:flex;align-items:center;gap:12px;margin-bottom:12px}
.avatar{flex:none;width:40px;height:40px;border-radius:50%;background:var(--navy);color:#fff;display:grid;place-items:center;font-weight:700;font-size:14px;letter-spacing:.02em}
.card.on .avatar{background:var(--teal);color:var(--fill-ink)}
.card h3{font-size:16px;font-weight:700;flex:1;min-width:0;overflow-wrap:anywhere}
.badge{font-size:12px;font-weight:700;padding:4px 10px;border-radius:99px;background:var(--focus);color:var(--card)}
.card ul{margin:0;padding:0;list-style:none;font-size:15px}
.card li{padding:6px 0;border-top:1px solid var(--line)}
.card li:first-child{border-top:0}
.count{font-size:13px;color:var(--muted);margin-bottom:8px}

/* calendar */
.cal{list-style:none;margin:0;padding:0;display:grid;grid-template-columns:repeat(auto-fill,minmax(128px,1fr));gap:10px}
.cal li{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:10px 12px;min-height:76px;font-size:14px;display:flex;flex-direction:column;gap:6px;overflow-wrap:anywhere;transition:transform .2s}
@media (hover:hover){.cal li:hover{transform:translateY(-2px)}}
.cal-h{display:flex;align-items:baseline;gap:6px}
.dn{font-weight:700;font-size:16px}
.wd{font-size:12px;color:var(--muted);font-weight:600}
.cal .all{background:var(--sand);border-color:var(--sand);color:#1d2f3a}
.cal .all .wd{color:#3d3b2f}
.cal .now{box-shadow:inset 0 0 0 2px var(--focus)}
.cal .past{color:var(--muted)}
.cal .past .dn{color:var(--muted)}

/* editor */
.editor{margin-top:48px;background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:4px 20px 20px;box-shadow:var(--shadow)}
.editor summary{cursor:pointer;font-weight:700;font-size:16px;min-height:52px;display:flex;align-items:center;list-style:none;border-radius:12px}
.editor summary::-webkit-details-marker{display:none}
.editor summary::after{content:"+";margin-left:auto;font-size:22px;line-height:1;color:var(--muted);transition:transform .2s}
.editor[open] summary::after{transform:rotate(45deg)}
.field{display:block;margin:20px 0 8px;font-weight:600;font-size:15px}
textarea,.input{width:100%;font:inherit;font-size:16px;padding:12px 14px;border-radius:14px;border:1px solid var(--field);background:var(--bg);color:var(--ink)}
textarea{min-height:160px;resize:vertical}
.input{max-width:240px;min-height:44px}
.row{display:flex;flex-wrap:wrap;gap:8px;margin-top:16px;align-items:center}
.msg{min-height:24px;margin-top:16px;font-weight:600;color:var(--ok)}
.msg.err{color:var(--err)}
.hint{font-size:14px;color:var(--muted);margin-top:12px}

@keyframes rise{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
@keyframes pulse{50%{opacity:.35}}
@media (min-width:640px){.hero{padding:36px}.topbar{flex-wrap:nowrap}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>

<div class="app" id="obsah">

<header class="topbar">
  <div class="brand">
    <div class="logo" aria-hidden="true"><b>D</b><svg width="14" height="26" viewBox="0 0 14 26"><path d="M5.5 0h3v7H14v3H8.5v16h-3V10H0V7h5.5z" fill="#2A4A5E"/></svg><i>O</i></div>

      <h1>Modlitební řetězec</h1>

<div class="monthbar">

<details class="editor" id="editor">

  <label class="field" for="e-members">Jména, za která se modlíme (jedno na řádek, jméno a začátek příjmení, např. „Sam R.“)</label>

  <label class="field" for="e-start">První měsíc řetězce</label>

  <div class="row">
    <button class="btn primary" id="save" type="button">Uložit změny</button>

</details>

<script type="module">
// ---------- FIREBASE: sem vlož údaje z Firebase konzole (Nastavení projektu > Vaše aplikace > Konfigurace) ----------
const FIREBASE_CONFIG = {
  apiKey: "AIzaSyCTDLZnGjVQUeD55mbw7UdFw_hogdsEcfo",
  authDomain: "praychain-d50e1.firebaseapp.com",
  projectId: "praychain-d50e1",
  storageBucket: "praychain-d50e1.firebasestorage.app",
  messagingSenderId: "822493308204",
  appId: "1:822493308204:web:abb16b7ca684104f543889"
};
// ---------- VÝCHOZÍ DATA (použijí se jen při prvním spuštění, když v databázi nic není) ----------
const DEFAULT_CONFIG = {
  start: "2026-11",
  prayers: ["Jindra K.","Klárka P.","Tobik S.","Peťa T.","Miri K.","Jáchym Ch.","Eliška K.","Sam R.","Maťo R.","Terka Ch."],
  members: ["Sam R.","Eliška A.","Tonda B.","Miri K.","Klárka P.","Maťo R.","Justy S.","Tobik S.","Baja S.","Kača S.","Peťa T.","Ela B.","Jáchym Ch.","Terka Ch.","Eliška K.","Sára N.","Marki S.","Maryśka T.","Gabka B.","Ania K.","Jindra K.","Anet Kl.","Ania St.","Marek H.","Anet Ka.","Terka K.","Ruben N.","Martin R.","Andrejka S.","Maťo S.","Venďa S.","Johi S.","Jirka S.","Kristi B.","Viki B.","Kuba Ch.","Šimon K.","Šarlotka K.","Janča M.","Danek P.","Kryštof S.","Miri S.","Beata K.","Nela G.","Sebastian L.","Ania Su."],
  history: {}
};
// ----------------------------------------------------------------------------------------------------------

const KEY = "dorost-modlitebni-retezec-v1";
const FIREBASE_VERSION = "10.12.2";
const MONTHS = ["Leden","Únor","Březen","Duben","Květen","Červen","Červenec","Srpen","Září","Říjen","Listopad","Prosinec"];
const WEEKDAYS = ["Ne","Po","Út","St","Čt","Pá","So"];
const INFEASIBLE = "S těmito seznamy se losování nedá rozdělit tak, aby nikdo neměl sám sebe ani stejné lidi jako minulý měsíc. Zkus upravit jména.";
const $ = id => document.getElementById(id);
const uniq = a => [...new Set(a)];
const lines = s => uniq(s.split("\n").map(x => x.trim()).filter(Boolean));
const pad = n => String(n).padStart(2, "0");
const monthIdx = (y, m) => y * 12 + m;
const parseStart = s => { const [y, m] = s.split("-").map(Number); return monthIdx(y, m - 1); };
const monthKey = idx => Math.floor(idx / 12) + "-" + pad(idx % 12 + 1);
const daysIn = idx => new Date(Math.floor(idx / 12), idx % 12 + 1, 0).getDate();
const now = new Date();
const curIdx = monthIdx(now.getFullYear(), now.getMonth());
let viewIdx = curIdx;
let cfg;
let fs = null, ref = null;

function el(tag, cls, text){ const e = document.createElement(tag); if (cls) e.className = cls; if (text != null) e.textContent = text; return e; }
function say(text, isError){ const m = $("msg"); m.textContent = text; m.className = isError ? "msg err" : "msg"; }
function setAlert(text){ $("alert").textContent = text || ""; }
function setSync(state, text){
  $("sync").className = "sync " + state;
  $("syncText").textContent = text;
}
const initials = name => { const p = name.split(/\s+/); return ((p[0] || "")[0] + (p[1] || "")[0]).toUpperCase(); };

// ---------- čištění konfigurace ----------
function cleanCfg(raw){
  const list = v => Array.isArray(v) ? uniq(v.map(x => String(x).trim()).filter(Boolean)) : [];
  const start = typeof raw?.start === "string" ? raw.start.trim() : "";
  const c = {
    start,
    members: list(raw?.members),
    prayers: list(raw?.prayers),
    history: raw?.history && typeof raw.history === "object" ? raw.history : {}
  };
  if (!/^\d{4}-(0[1-9]|1[0-2])$/.test(start)) return { error: "Měsíc zadej ve tvaru RRRR-MM, např. 2026-11." };
  if (!c.prayers.length || c.members.length < c.prayers.length) return { error: "Potřebuju aspoň jednoho modlitebníka a víc jmen než modlitebníků." };
  return { cfg: c };
}

function loadLocalCfg(){
  try { const c = cleanCfg(JSON.parse(localStorage.getItem(KEY))); if (!c.error) return c.cfg; } catch (e) {}
  return cleanCfg(DEFAULT_CONFIG).cfg;
}
function saveLocal(){ localStorage.setItem(KEY, JSON.stringify(cfg)); }

// ---------- losování ----------
function hash(s){ let x = 1779033703 ^ s.length; for (let i = 0; i < s.length; i++){ x = Math.imul(x ^ s.charCodeAt(i), 3432918353); x = x << 13 | x >>> 19; } return x >>> 0; }
function rng(a){ return () => { a |= 0; a = a + 0x6D2B79F5 | 0; let t = Math.imul(a ^ a >>> 15, 1 | a); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }
function shuffle(arr, r){ for (let i = arr.length - 1; i > 0; i--){ const j = Math.floor(r() * (i + 1)); [arr[i], arr[j]] = [arr[j], arr[i]]; } return arr; }

// Přiřazení lidí ke skupinám jako tok v síti: každý člověk do jedné skupiny, kapacity skupin přesné.
function assignGroups(n, sizes, allowed, r){
  const p = sizes.length, S = n + p, T = S + 1, V = T + 1;
  const adj = Array.from({ length: V }, () => []), to = [], cap = [];
  const edge = (u, v, c) => { adj[u].push(to.length); to.push(v); cap.push(c); adj[v].push(to.length); to.push(u); cap.push(0); };
  shuffle([...Array(n).keys()], r).forEach(i => {
    edge(S, i, 1);
    shuffle([...Array(p).keys()], r).forEach(g => { if (allowed(i, g)) edge(i, n + g, 1); });
  });
  sizes.forEach((s, g) => edge(n + g, T, s));
  let flow = 0;
  for (;;){
    const via = new Array(V).fill(-1), seen = new Array(V).fill(false), queue = [S];
    seen[S] = true;
    for (let h = 0; h < queue.length && !seen[T]; h++){
      for (const e of adj[queue[h]]){ const v = to[e]; if (!seen[v] && cap[e] > 0){ seen[v] = true; via[v] = e; queue.push(v); } }
    }
    if (!seen[T]) break;
    for (let v = T; v !== S; v = to[via[v] ^ 1]){ cap[via[v]]--; cap[via[v] ^ 1]++; }
    flow++;
  }
  if (flow < n) return null;
  const groups = Array.from({ length: p }, () => []);
  for (let i = 0; i < n; i++)
    for (const e of adj[i])
      if (e % 2 === 0 && to[e] >= n && to[e] < n + p && cap[e] === 0) groups[to[e] - n].push(i);
  return groups;
}

function solveMonth(c, idx, prev){
  const P = c.prayers.length, N = c.members.length;
  const base = Math.floor(N / P), extra = N % P, offset = idx % P;
  const sizes = c.prayers.map((_, g) => base + ((g - offset + P) % P < extra ? 1 : 0));
  const r = rng(hash(c.members.join("|") + "#" + c.prayers.join("|") + "@" + idx));
  const allowed = (i, g) => {
    const name = c.members[i], prayer = c.prayers[g];
    return name !== prayer && !(prev && (prev[prayer] || []).includes(name));
  };
  const groups = assignGroups(N, sizes, allowed, r);
  if (!groups) throw new Error("losování nevyšlo");
  const out = {};
  c.prayers.forEach((p, g) => { out[p] = groups[g].map(i => c.members[i]); });
  return out;
}

// Vrací přiřazení pro měsíc; uplynulé měsíce jsou uložené v c.history a nepřepočítávají se.
function computeMonth(c, idx, memo){
  if (memo[idx]) return memo[idx];
  const frozen = c.history[monthKey(idx)];
  if (frozen) return memo[idx] = frozen;
  const prev = idx > parseStart(c.start) ? computeMonth(c, idx - 1, memo) : null;
  return memo[idx] = solveMonth(c, idx, prev);
}

function freezePast(c){
  let changed = false;
  for (let i = parseStart(c.start); i < curIdx; i++){
    const k = monthKey(i);
    if (!c.history[k]){ c.history[k] = computeMonth(c, i, {}); changed = true; }
  }
  return changed;
}

function validateAhead(c){
  const memo = {};
  for (let i = parseStart(c.start); i <= curIdx + 12; i++) computeMonth(c, i, memo);
}

// ---------- databáze (Firestore) ----------
async function connectFirebase(){
  if (!FIREBASE_CONFIG.apiKey || !FIREBASE_CONFIG.projectId) return false;
  try {
    const base = `https://www.gstatic.com/firebasejs/${FIREBASE_VERSION}/`;
    const [appMod, fsMod] = await Promise.all([import(base + "firebase-app.js"), import(base + "firebase-firestore.js")]);
    const app = appMod.initializeApp(FIREBASE_CONFIG);
    fs = fsMod;
    ref = fsMod.doc(fsMod.getFirestore(app), "retezec", "hlavni");
    return true;
  } catch (e) {
    return false;
  }
}

async function pushRemote(c){
  if (!ref) return null;
  try {
    await fs.setDoc(ref, { data: JSON.stringify(c), updated: fs.serverTimestamp() });
    return null;
  } catch (e) {
    return "Nastavení se nepodařilo uložit do sdílené databáze. Zkontroluj připojení.";
  }
}

function listenRemote(){
  fs.onSnapshot(ref, snap => {
    if (snap.metadata.fromCache) return;
    setSync("live", "Sdíleno živě");
    if (!snap.exists()){
      pushRemote(cfg);
      return;
    }
    let parsed = null;
    try { parsed = JSON.parse(snap.data().data); } catch (e) {}
    const c = cleanCfg(parsed || {});
    if (c.error) return setAlert("Sdílené nastavení je poškozené. Otevři úpravy a ulož je znovu.");
    c.cfg.history = Object.assign({}, cfg.history, c.cfg.history);
    adopt(c.cfg);
  }, () => setSync("error", "Bez spojení"));
}

// Přijme nastavení z databáze; případně doplní zmrazené měsíce a pošle je zpět.
function adopt(next){
  try {
    if (freezePast(next)) pushRemote(next);
    validateAhead(next);
  } catch (e) {
    return setAlert(INFEASIBLE);
  }
  cfg = next;
  saveLocal();
  if (!$("editor").open) fillEditor();
  setAlert("");
  render();
}

// Uloží nové seznamy; dříve uplynulé měsíce zůstanou zmrazené podle původních seznamů.
async function applyCfg(next){
  try {
    freezePast(cfg);
    next.history = Object.assign({}, next.history, cfg.history);
    freezePast(next);
    validateAhead(next);
  } catch (e) {
    return INFEASIBLE;
  }
  cfg = next;
  saveLocal();
  fillEditor();
  viewIdx = curIdx;
  render();
  return await pushRemote(cfg);
}

// ---------- vykreslení ----------
function prayerForDay(day, total){ return day === total ? -1 : (day - 1) % cfg.prayers.length; }

function render(){
  const startIdx = parseStart(cfg.start);
  if (viewIdx < startIdx) viewIdx = startIdx;
  const y = Math.floor(viewIdx / 12), m = viewIdx % 12, total = daysIn(viewIdx);
  const isNow = viewIdx === curIdx, isPast = viewIdx < curIdx, today = now.getDate();
  $("mname").textContent = MONTHS[m] + " " + y;
  $("prev").disabled = viewIdx <= startIdx;
  $("next").disabled = viewIdx >= curIdx;
  $("note").textContent = isPast ? "Uplynulý měsíc · losování je uzavřené" : "";
  let map;
  try { map = computeMonth(cfg, viewIdx, {}); }
  catch (e) {
    setAlert("Losování pro tento měsíc se nepodařilo spočítat. Zkontroluj seznamy v úpravách.");
    $("today").replaceChildren(); $("board").replaceChildren(); $("cal").replaceChildren();
    return;
  }
  setAlert("");
  const todayP = isNow ? prayerForDay(today, total) : null;
  renderToday(isNow, todayP, today, m, map);
  renderBoard(map, todayP);
  renderCalendar(y, m, total, isNow ? today : null);
}

function renderToday(isNow, todayP, today, m, map){
  const t = $("today");
  t.replaceChildren();
  if (!isNow) return;
  t.appendChild(el("p", "eyebrow", "Dnes, " + today + ". " + (m + 1) + "."));
  if (todayP === -1){
    t.appendChild(el("p", "who", "Dnes se modlí všichni"));
    t.appendChild(el("p", "lead", "Poslední den měsíce patří celému řetězci. Modlete se za všechna jména na nástěnce."));
    return;
  }
  const who = cfg.prayers[todayP], list = map[who] || [];
  t.appendChild(el("p", "eyebrow", "Dnes se modlí"));
  t.appendChild(el("p", "who", who));
  t.appendChild(el("p", "lead", "za tyto lidi:"));
  const chips = el("ul", "chips");
  list.forEach(n => chips.appendChild(el("li", "chip", n)));
  t.appendChild(chips);
  const b = el("button", "btn", "Zkopírovat připomínku");
  b.type = "button";
  b.onclick = async () => {
    const txt = who + ", dnes se modlíš za: " + list.join(", ") + ".";
    const ok = navigator.clipboard ? await navigator.clipboard.writeText(txt).then(() => true, () => false) : false;
    if (ok){
      b.textContent = "Zkopírováno";
      setTimeout(() => { b.textContent = "Zkopírovat připomínku"; }, 2000);
    } else prompt("Zkopíruj text:", txt);
  };
  t.appendChild(b);
}

function renderBoard(map, todayP){
  const board = $("board");
  board.replaceChildren();
  cfg.prayers.forEach((p, i) => {
    const names = map[p] || [];
    const li = el("li", "card" + (todayP === i ? " on" : ""));
    li.style.animationDelay = (i * 30) + "ms";
    const head = el("div", "card-head");
    const avatar = el("span", "avatar", initials(p));
    avatar.setAttribute("aria-hidden", "true");
    head.appendChild(avatar);
    head.appendChild(el("h3", null, p));
    if (todayP === i) head.appendChild(el("span", "badge", "Dnes"));
    li.appendChild(head);
    li.appendChild(el("p", "count", names.length + " jmen"));
    const ul = el("ul");
    names.forEach(n => ul.appendChild(el("li", null, n)));
    li.appendChild(ul);
    board.appendChild(li);
  });
}

function renderCalendar(y, m, total, todayD){
  const cal = $("cal");
  cal.replaceChildren();
  for (let d = 1; d <= total; d++){
    const p = prayerForDay(d, total), isAll = p === -1;
    const cls = [isAll ? "all" : "", todayD === d ? "now" : "", todayD !== null && d < todayD ? "past" : ""].filter(Boolean).join(" ");
    const li = el("li", cls);
    if (todayD === d) li.setAttribute("aria-current", "date");
    const head = el("div", "cal-h");
    head.appendChild(el("span", "dn", String(d)));
    head.appendChild(el("span", "wd", WEEKDAYS[new Date(y, m, d).getDay()]));
    li.appendChild(head);
    li.appendChild(el("span", "n", isAll ? "Všichni" : cfg.prayers[p]));
    cal.appendChild(li);
  }
}

// ---------- úpravy ----------
function fillEditor(){
  $("e-members").value = cfg.members.join("\n");
  $("e-prayers").value = cfg.prayers.join("\n");
  $("e-start").value = cfg.start;
}

$("save").onclick = async () => {
  const c = cleanCfg({ start: $("e-start").value, members: lines($("e-members").value), prayers: lines($("e-prayers").value) });
  if (c.error) return say(c.error, true);
  say("Ukládám…");
  const err = await applyCfg(c.cfg);
  if (err) return say(err, true);
  say(fs ? "Uloženo. Změna se hned zobrazí na všech zařízeních." : "Uloženo v tomto zařízení. Sdílená databáze zatím není připojená.");
};

$("prev").onclick = () => { viewIdx--; render(); };
$("next").onclick = () => { viewIdx++; render(); };

// ---------- start ----------
cfg = loadLocalCfg();
try {
  if (freezePast(cfg)) saveLocal();
} catch (e) {
  setAlert(INFEASIBLE);
}
fillEditor();
render();

if (await connectFirebase()){
  setSync("connecting", "Připojuji…");
  listenRemote();
} else {
  setSync("", "Jen v tomto zařízení");
}
</script>
